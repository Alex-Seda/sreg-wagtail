<section class="py-20 md:py-28{% if value.background == 'sand' %} bg-linen-100{% endif %}">
  <div class="wrap">
    {% if value.heading %}<h2 class="heading-lg max-w-2xl">{{ value.heading }}</h2>{% endif %}

    <div class="{% if value.heading %}mt-12 {% endif %}grid gap-12 md:grid-cols-2 md:gap-x-16 md:gap-y-14">
      {% for item in value.items %}
        <figure class="border-l-2 border-taupe-400 pl-6">
          <blockquote class="font-display text-2xl font-medium leading-snug md:text-3xl">
            <p>{{ item.quote }}</p>
          </blockquote>
          <figcaption class="mt-5 text-sm">
            <span class="font-medium">{{ item.name }}</span>
            {% if item.detail %}<span class="block text-umber-700">{{ item.detail }}</span>{% endif %}
          </figcaption>
        </figure>
      {% endfor %}
    </div>
  </div>
</section>
