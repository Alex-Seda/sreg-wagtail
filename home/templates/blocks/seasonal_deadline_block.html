<section class="py-8 md:py-10">
  <div class="wrap">
    <div class="relative overflow-hidden bg-evergreen-900 px-6 py-8 text-linen-50 shadow-sm sm:px-10 md:flex md:items-center md:justify-between md:gap-10 md:px-12 md:py-10">
      <div class="absolute left-0 top-0 h-1.5 w-full bg-berry-700"></div>
      <div>
        {% if value.eyebrow %}<p class="text-sm font-semibold uppercase tracking-[0.2em] text-sand-200">{{ value.eyebrow }}</p>{% endif %}
        <h2 class="heading-lg mt-2">{{ value.heading }}</h2>
        {% if value.detail %}<p class="mt-3 max-w-xl leading-7 text-linen-100">{{ value.detail }}</p>{% endif %}
      </div>
      <p class="mt-7 shrink-0 border-l-2 border-sand-200/60 pl-5 font-display text-3xl font-medium leading-tight text-sand-200 sm:text-4xl md:mt-0 md:max-w-xs">{{ value.date }}</p>
    </div>
  </div>
</section>
